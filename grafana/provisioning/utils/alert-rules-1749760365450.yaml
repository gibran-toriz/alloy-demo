apiVersion: 1
groups:
    - orgId: 1
      name: memory_group
      folder: Memory
      interval: 1m
      rules:
        - uid: beordhq70tvcwd
          title: Memory Alert
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: eeoral61vp3b4d
              model:
                disableTextWrap: false
                editorMode: code
                expr: ((node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes) * 100
                fullMetaSearch: false
                includeNullMetadata: true
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
                useBackend: false
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 60
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: NoData
          execErrState: Error
          for: 1m
          keepFiringFor: 1m
          annotations:
            description: RAM
            summary: The memory has reached the warning threshold
          isPaused: false
          notification_settings:
            receiver: iwRobot-Webhook

((node_memory_MemTotal_bytes{nodename="Server-1"} - node_memory_MemAvailable_bytes{nodename="Server-1"}) / node_memory_MemTotal_bytes{nodename="Server-1"}) * 100